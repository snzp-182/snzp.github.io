<style>
* {
    margin: 0;
    padding: 0;
    list-style: none;
    text-decoration: none;
    box-sizing: border-box;
}

/* ========= 顶部通栏：LOGO + 搜索框 + 右侧导航 ========= */
.top-bar {
    height: 70px;
    background: #fff;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0;
    left: 180px;
    right: 0;
    z-index: 99;
}

/* 左侧LOGO */
.logo {
    position: fixed;
    top: 10px;
    left: 20px;
    z-index: 100;
}
.logo img {
    height: 50px;
}

/* 搜索框 */
#top_input {
    display: flex;
    align-items: center;
}
#top_input input {
    padding: 5px;
    height: 40px;
    width: 280px;
    border: 1px solid #ccc;
    border-radius: 4px;
}
#top_input img {
    height: 40px;
    margin-left: 5px;
}

/* 右侧小导航 */
.top-right {
    display: flex;
    gap: 12px;
    align-items: center;
}

/* ========= 左侧固定导航栏 ========= */
#nav {
    width: 180px;
    background: #0A7EB8;
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    padding-top: 70px;
    z-index: 98;
}
#nav ul {
    display: flex;
    flex-direction: column;
}
#nav a {
    display: block;
    padding: 16px 20px;
    color: #fff;
    font-size: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}
#nav a:hover {
    background: #409cd8;
    padding-left: 25px;
    transition: 0.3s;
}
#nav a.acti {
    background: #ff9900;
    color: #fff;
    font-weight: bold;
}

/* ========= 主体内容 ========= */
body {
		background-color: #F1F7FB;
	background-repeat:no-repeat;
	background-size: cover;
	background-position: center;
    padding-left: 180px;
    padding-top: 70px;
    padding-bottom: 300px; /* 给底部留空间 */
}

/* 产品居中 */

/* 产品靠左分布 + 文字在图片下方 */
.product {
  padding: 40px 30px;
  text-align: center;   /* 让图片和文字内部居中 */
  display: inline-block;
  margin-right: 40px;   /* 产品之间间距 */
}
.product img {
  width: 150px;
  display: block;
  margin: 0 auto 10px;  /* 文字在图片下方，间距10px */
}
.product h2 {
  font-size: 20px;
  color: #333;
  margin: 0;
  text-align: center;
}
/* ========= 底部固定在页面底部 ========= */
.footer {
    position: fixed;
    left: 180px;
    margin-left: 60px;
    margin-right: 60px;
    right: 0;
    bottom: 0;
    background: #0A7EB8;
    color: #fff;
    padding: 30px 20px;
    z-index: 90;
}
.footer-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    max-width: 1000px;
    margin: 0 auto;
    gap: 20px;
}
.footer-col {
    flex: 1;
    min-width: 200px;
}
.footer-col h3 {
    font-size: 16px;
    color: #ff9900;
    margin-bottom: 12px;
}
.footer-col a, .footer-col p {
    color: #fff;
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
}
.footer-bottom {
    text-align: center;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-size:13px;
}
#backTop {
    cursor: pointer;
    color: #ff9900;
}
/*图片内容*/

  display: flex;

  padding: 40px 30px;
  flex-wrap: wrap;  /* 小屏幕自动换行 */
  align-items: flex-start;
}

/* 每个产品项：图片+文字垂直排列 */
.product-item {
  text-align: center; /* 文字在图片下方居中 */
  width: 150px;
}
.product-item img {
  width: 150px;
  display: block;
  margin-bottom: 10px;
}
.product-item h2 {
  font-size: 18px;
  margin: 0;
  color: #333;
}
</style>
